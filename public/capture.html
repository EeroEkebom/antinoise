<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Take recorder (dev)</title>
<style>
body { font-family: -apple-system, sans-serif; background: #0d1017; color: #d9dee8; margin: 20px; font-size: 14px; }
button { padding: 8px 16px; }
video { margin-top: 14px; max-width: 640px; border-radius: 8px; }
#state { margin-top: 10px; color: #8a93a5; white-space: pre-wrap; }
</style>
</head>
<body>
<h1 style="font-size:16px">Take recorder — capture THIS tab (dev only)</h1>
<button id="start">Start capture (choose "This Tab" + "Share audio" if offered)</button>
<button id="stop" disabled>Stop &amp; save</button>
<span id="state">idle</span>
<video id="prev" autoplay muted playsinline></video>
<script>
let rec = null; let chunks = [];
document.getElementById('start').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'browser' },
      audio: true, // the tab's audio = the app's Web Audio graph, sampled straight from the mix
      preferCurrentTab: true,
    });
    document.getElementById('prev').srcObject = stream;
    chunks = [];
    rec = new MediaRecorder(stream, { mimeType: 'video/mp4', videoBitsPerSecond: 6_000_000 });
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    document.getElementById('state').textContent = 'capturing… (do not touch this tab)';
    document.getElementById('start').disabled = true;
    document.getElementById('stop').disabled = false;
    rec.start();
  } catch (e) {
    document.getElementById('state').textContent = 'capture refused: ' + e;
  }
});
document.getElementById('stop').addEventListener('click', () => {
  rec.onstop = async () => {
    const blob = new Blob(chunks, { type: 'video/mp4' });
    document.getElementById('state').textContent = 'saving ' + Math.round(blob.size / 1e6) + ' MB…';
    await fetch('/api/capture', { method: 'POST', headers: { 'Content-Type': 'video/mp4' }, body: blob });
    document.getElementById('state').textContent = 'saved ✓ — check the driver output';
    document.getElementById('prev').srcObject = null;
  };
  rec.stop();
  document.getElementById('stop').disabled = true;
});
</script>
</body>
</html>
